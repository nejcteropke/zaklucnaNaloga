<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<title>Bandmade Calendar</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
body{
    background:#0f0f0f;
    color:white;
    font-family:Segoe UI;
    text-align:center;
    margin: 0;
    padding: 0;
}

header {
    position: fixed;
    top: 0;
    width: 100%;
    background: rgba(17, 17, 17, 0.95);
    border-bottom: 2px solid #2ecc71;
    padding: 20px 0;
    z-index: 10;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
}

h1{
    margin: 0;
    font-size: 2.5rem;
}

/* Menu Toggle Button */
.menu-toggle {
    font-size: 1.8rem;
    color: white;
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 3px;
    width: 50px;
    height: 50px;
    position: fixed;
    left: 10px;
    top: 15px;
    z-index: 1000;
    border-radius: 50%;
    background: rgba(40, 40, 40, 0.8);
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
    transition: all 0.3s ease;
}

.menu-toggle:hover {
    background: rgba(60, 60, 60, 0.9);
}

.menu-toggle .dots {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.menu-toggle .dot {
    width: 6px;
    height: 6px;
    background-color: white;
    border-radius: 50%;
    transition: all 0.3s ease;
}

.menu-toggle:hover .dot {
    background-color: #2ecc71;
}

/* Sliding Menu */
.side-menu {
    position: fixed;
    left: -350px;
    top: 0;
    width: 300px;
    height: 100%;
    background: rgba(15, 15, 15, 0.95);
    z-index: 999;
    padding: 100px 20px 40px;
    transition: all 0.4s ease;
    box-shadow: 5px 0 15px rgba(0, 0, 0, 0.5);
    border-right: 1px solid #222;
}

.side-menu.open {
    left: 0;
}

.menu-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    z-index: 998;
    opacity: 0;
    visibility: hidden;
    transition: all 0.4s ease;
}

.menu-overlay.open {
    opacity: 1;
    visibility: visible;
}

.menu-items {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.menu-item {
    padding: 14px 20px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
    color: white;
    text-decoration: none;
    font-size: 1.1rem;
    transition: all 0.3s ease;
    background: rgba(40, 40, 40, 0.4);
}

.menu-item:hover {
    background: rgba(46, 204, 113, 0.15);
    transform: translateX(5px);
}

.menu-item i {
    font-size: 1.2rem;
    width: 24px;
    color: #2ecc71;
}

.menu-title {
    font-size: 1.2rem;
    color: #999;
    margin-bottom: 15px;
    padding-left: 10px;
    border-left: 3px solid #2ecc71;
}

main {
    margin-top: 100px;
    padding: 20px;
}

.month-navigation{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    margin:20px 0;
}

.month-navigation button{
    padding:5px 15px;
    background:#2ecc71;
    border:none;
    border-radius:5px;
    color:white;
    cursor:pointer;
}

.month-navigation button:hover{
    background:#27ae60;
}

.calendar{
    max-width:900px;
    margin:0 auto;
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:10px;
}

.day-name{
    font-weight:bold;
    color:#2ecc71;
}

.day{
    background:#1c1c1c;
    padding:10px;
    border-radius:8px;
    min-height:80px;
    transition:0.2s;
    position:relative;
    overflow:auto;
}

.day:hover{
    background:#2a2a2a;
    cursor:pointer;
}

.day .day-number{
    font-weight:bold;
    margin-bottom:5px;
}

.event-item{
    font-size:0.75rem;
    padding:2px 4px;
    border-radius:4px;
    margin-top:2px;
    display:block;
    color:white;
}

.free{
    background:#2ecc71;
}

.busy{
    background:#27ae60;
}

.maybe{
    background:#f1c40f;
}

.event-form{
    margin:30px auto 0;
    max-width:600px;
}

input, select{
    padding:8px;
    margin:5px;
    border-radius:5px;
    border:1px solid #2ecc71;
    background-color:#181f18;
    color:white;
}

button[type="submit"], #resetCalendar{
    padding:8px 15px;
    background:#2ecc71;
    border:none;
    border-radius:5px;
    color:white;
    cursor:pointer;
}

button[type="submit"]:hover, #resetCalendar:hover{
    background:#27ae60;
}

</style>
</head>

<body>

<!-- Menu Toggle Button (Three Dots) -->
<button class="menu-toggle" id="menuToggle">
    <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>
</button>

<!-- Sliding Side Menu -->
<div class="side-menu" id="sideMenu">
    <h3 class="menu-title">Navigation</h3>
    <div class="menu-items">
        <a href="{{ url_for('home') }}" class="menu-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="{{ url_for('find_people') }}" class="menu-item">
            <i class="fas fa-users"></i>
            <span>Find people</span>
        </a>
        <a href="{{ url_for('jam_sessions') }}" class="menu-item">
            <i class="fas fa-music"></i>
            <span>Jam sessions</span>
        </a>
        <a href="{{ url_for('calendar') }}" class="menu-item">
            <i class="fas fa-calendar-alt"></i>
            <span>Events</span>
        </a>
        <a href="{{ url_for('chat_page') }}" class="menu-item">
            <i class="fas fa-comments"></i>
            <span>Chat</span>
        </a>
    </div>
</div>

<!-- Menu Overlay -->
<div class="menu-overlay" id="menuOverlay"></div>

<header>
    <h1>📅 Bandmade Calendar</h1>
</header>

<main>

<div class="month-navigation">
    <button id="prevMonth">⬅</button>
    <h2 id="monthYear"></h2>
    <button id="nextMonth">➡</button>
</div>

<div class="calendar"></div>

<div class="event-form">
<h2>Add availability</h2>
<form id="addEventForm" action="{{ url_for('add_event') }}" method="post">
    <input type="date" name="date" id="dateInput" required>
    <input type="text" name="title" placeholder="Example: rehearsal">
    <select name="status">
        <option value="free">Free</option>
        <option value="busy">Busy</option>
        <option value="maybe">Maybe</option>
    </select>
    <button type="submit">Add</button>
</form>
</div>

<form id="resetForm" action="{{ url_for('reset_calendar') }}" method="post" style="display:inline;">
    <button type="submit" id="resetCalendar" onclick="return confirm('Are you sure you want to delete all events?')">Reset Calendar</button>
</form>

</main>

<script>
// Menu toggle
const menuToggle = document.getElementById('menuToggle');
const sideMenu = document.getElementById('sideMenu');
const menuOverlay = document.getElementById('menuOverlay');

menuToggle.addEventListener('click', function() {
    sideMenu.classList.toggle('open');
    menuOverlay.classList.toggle('open');
});

menuOverlay.addEventListener('click', function() {
    sideMenu.classList.remove('open');
    menuOverlay.classList.remove('open');
});

// Events from server

let events = {{ events | tojson }};

// Current month and year
let today = new Date();
let currentMonth = today.getMonth();
let currentYear = today.getFullYear();

const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function renderCalendar(month, year){
    const calendarDiv = document.querySelector('.calendar');
    calendarDiv.innerHTML = '';

    // Day names
    const dayNames = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
    for(let d of dayNames){
        calendarDiv.innerHTML += `<div class="day-name">${d}</div>`;
    }

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month+1, 0).getDate();

    let startDay = firstDay - 1;
    if(startDay < 0) startDay = 6;

    for(let i=0; i<startDay; i++){
        calendarDiv.innerHTML += `<div class="day"></div>`;
    }

    for(let i=1; i<=daysInMonth; i++){
        let dayDiv = document.createElement('div');
        dayDiv.classList.add('day');
        dayDiv.innerHTML = `<div class="day-number">${i}</div>`;
        dayDiv.onclick = ()=> selectDay(i, month+1, year);

        const dayStr = `${year}-${(month+1).toString().padStart(2,'0')}-${i.toString().padStart(2,'0')}`;
        const dayEvents = events.filter(e => e.date === dayStr);
        for(let ev of dayEvents){
            const span = document.createElement('span');
            span.classList.add('event-item', ev.status);
            span.innerText = ev.title;
            dayDiv.appendChild(span);
        }

        calendarDiv.appendChild(dayDiv);
    }

    document.getElementById('monthYear').innerText = monthNames[month] + " " + year;
}

// Navigation
document.getElementById('prevMonth').addEventListener('click', ()=>{
    currentMonth--;
    if(currentMonth < 0){
        currentMonth = 11;
        currentYear--;
    }
    renderCalendar(currentMonth, currentYear);
});

document.getElementById('nextMonth').addEventListener('click', ()=>{
    currentMonth++;
    if(currentMonth > 11){
        currentMonth = 0;
        currentYear++;
    }
    renderCalendar(currentMonth, currentYear);
});

function selectDay(day, month, year){
    const dateString = `${year}-${month.toString().padStart(2,'0')}-${day.toString().padStart(2,'0')}`;
    document.getElementById("dateInput").value = dateString;
}

// Add event - now handled by form submit to server
// Removed preventDefault and local push, as page will reload with updated events

// Initial render
renderCalendar(currentMonth, currentYear);
</script>

</body>
</html>
